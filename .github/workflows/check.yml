name: Verify and build native local app
on:
  workflow_dispatch:
  push:
    paths: ["backend/**", "frontend/**", "tests/**", "scripts/**", "pyproject.toml", "uv.lock", "Start_MaiZi.bat", "Setup_Windows.bat", ".github/workflows/**"]
permissions:
  contents: read
jobs:
  local-app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare Windows source app
        if: runner.os == 'Windows'
        shell: cmd
        run: call Setup_Windows.bat --no-pause
      - name: Check Windows launcher prerequisites
        if: runner.os == 'Windows'
        shell: cmd
        run: call Start_MaiZi.bat --check
      - name: Prepare macOS Python dependencies
        if: runner.os != 'Windows'
        run: uv sync --frozen
      - name: Install macOS frontend dependencies
        if: runner.os != 'Windows'
        run: npm --prefix frontend ci
      - name: Build macOS frontend
        if: runner.os != 'Windows'
        run: npm --prefix frontend run build
      - run: uv run pytest -q
      - name: Install browser for acceptance tests
        run: npm --prefix frontend exec -- playwright install chromium
      - name: Browser acceptance
        run: npm --prefix frontend test
        env:
          MAIZI_BROWSER_CHANNEL: chromium
      - run: uv run python scripts/verify_release.py --output output/verification/source-release.json
      - run: uv run python scripts/build_bundle.py
      - name: Independently extracted native acceptance
        shell: pwsh
        run: |
          $bundle = Get-ChildItem dist/MaiZi-*.zip | Select-Object -First 1
          uv run python scripts/verify_release.py --bundle $bundle.FullName --output output/verification/native-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: MaiZi-${{ matrix.os }}
          path: dist/*.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Verification-${{ matrix.os }}
          path: output/verification/*.json
          retention-days: 7
