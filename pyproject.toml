[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maizi-assistant"
version = "0.2.0"
description = "Local spreadsheet workflows with approvals and row-level provenance"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3",
 "pydantic>=2.9,<3", "openpyxl>=3.1.5,<4", "defusedxml>=0.7,<1",
 "httpx>=0.27,<1", "python-multipart>=0.0.20,<1", "psutil>=6,<8",
 "platformdirs>=4,<5", "python-dotenv>=1,<2"
]

[dependency-groups]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "pyinstaller>=6,<7"]

[project.scripts]
maizi = "maizi.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/maizi"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
